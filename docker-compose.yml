services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle"]
      interval: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      retries: 30
  setup:
    build: .
    command: ["sh", "-c", "bun run migration:up && bun run queues"]
    environment: &env
      DATABASE_URL: postgres://jungle:jungle@postgres:5432/jungle
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
  api:
    build: .
    environment:
      <<: *env
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on:
      setup: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: .
    environment:
      <<: *env
      PORT: "3000"
    command: ["bun", "run", "src/worker-main.ts"]
    depends_on:
      setup: {condition: service_completed_successfully}
    restart: unless-stopped
  worker2:
    extends:
      service: worker
  worker3:
    extends:
      service: worker
volumes:
  postgres_data:
